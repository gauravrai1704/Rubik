[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nxn-rubiks"
version = "0.1.0"
description = "Six solvers for the N×N×1 Rubik's Square and N×N×N Rubik's Cube (3 <= N <= 20) on one shared engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
kociemba = ["kociemba>=1.2"]

[tool.setuptools.packages.find]
include = ["rubiks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: long-running test (run with -m slow)"]

[tool.ruff]
line-length = 120
target-version = "py310"
